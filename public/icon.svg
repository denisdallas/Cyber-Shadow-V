<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff5400" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="#00f5d4" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Stealth Grid Accent -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Assassin Hood & Visor Shape -->
  <g filter="url(#glow)">
    <!-- Stealth Hood -->
    <path d="M256 90 C180 90 140 160 135 245 C132 295 155 350 200 395 C235 430 256 445 256 445 C256 445 277 430 312 395 C357 350 380 295 377 245 C372 160 332 90 256 90 Z" fill="#0d1117" stroke="#00f5d4" stroke-width="8"/>
    
    <!-- Cyber Mask Plates -->
    <path d="M190 270 L256 315 L322 270 L300 360 L256 395 L212 360 Z" fill="#161b22" stroke="#334155" stroke-width="4"/>
    
    <!-- Neon Glowing Visor Slit -->
    <polygon points="175,230 337,230 325,252 256,262 187,252" fill="url(#neonRed)" />
    <!-- Visor Core Light -->
    <line x1="200" y1="242" x2="312" y2="242" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Dual Cyber Blades crossed in background -->
    <path d="M110 390 L210 290 L225 305 L125 405 Z" fill="url(#neonCyan)" opacity="0.85"/>
    <path d="M402 390 L302 290 L287 305 L387 405 Z" fill="url(#neonCyan)" opacity="0.85"/>
  </g>

  <!-- Crosshair targeting dots -->
  <circle cx="256" cy="246" r="3" fill="#ffffff" />
  <circle cx="256" cy="190" r="2" fill="#00f5d4" opacity="0.8"/>
  <circle cx="256" cy="302" r="2" fill="#00f5d4" opacity="0.8"/>
  <circle cx="202" cy="246" r="2" fill="#00f5d4" opacity="0.8"/>
  <circle cx="310" cy="246" r="2" fill="#00f5d4" opacity="0.8"/>
</svg>
